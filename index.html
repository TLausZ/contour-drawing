<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contour drawing</title>
<style>
  :root {
    --paper: #ece2cd;
    --paper-bright: #f2ead6;
    --ink: #5c4a34;
    --ink-soft: #6b5a42;
    --ink-faint: #8a7a5e;
    --line: rgba(74,58,40,0.68);
    --border: rgba(110,92,64,0.25);
    --border-strong: rgba(110,92,64,0.4);
    --accent: rgba(150,90,50,0.95);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.4;
    background: var(--paper);
    color: var(--ink-faint);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    height: 61px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 600; color: var(--ink); }
  header .sub { font-size: 12px; color: var(--ink-faint); }
  main { flex: 1; display: flex; min-height: 0; }
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    margin-right: 276px;
    transition: margin-right .2s, margin-left .2s;
    min-width: 0;
    overflow: hidden;
  }
  #stage.wide { margin-right: 0; }
  #stage.mleft { margin-left: 276px; }
  #wrapper { position: relative; display: inline-block; }
  #view {
    display: block;
    border: 1px solid var(--border);
    background: var(--paper);
    cursor: crosshair;
  }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #orig {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #orig:not(.ready) { display: none; }
  #divider {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 14px;
    margin-left: -7px;
    cursor: ew-resize;
  }
  #divider::before {
    content: '';
    position: absolute;
    left: 6px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--ink);
  }
  #divider::after {
    content: '';
    position: absolute;
    left: 1px;
    top: 50%;
    margin-top: -12px;
    width: 12px;
    height: 24px;
    border-radius: 4px;
    background: var(--ink);
  }
  .marker.b { background: var(--ink); }
  .marker {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    border: 1px solid var(--paper-bright);
    transform: translate(-50%, -50%);
    pointer-events: auto;
    cursor: grab;
  }
  #panel {
    position: fixed;
    top: 61px;
    right: 0;
    bottom: 0;
    width: 276px;
    background: var(--paper);
    border-left: 1px solid var(--border);
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform .2s;
  }
  #panel.hidden { transform: translateX(277px); }
  #ptoggle {
    position: fixed;
    top: 73px;
    right: 276px;
    z-index: 3;
    width: 29px;
    height: 29px;
    flex: none;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    font-size: 15px;
    line-height: 27px;
    padding: 0;
    transition: right .2s;
  }
  #ptoggle.hidden { right: 8px; }
  #maskPanel {
    position: fixed;
    top: 61px;
    left: 0;
    bottom: 0;
    width: 276px;
    background: var(--paper);
    border-right: 1px solid var(--border);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform .2s;
    z-index: 2;
  }
  #maskPanel.hidden { transform: translateX(-277px); }
  #maskPanel > button, #panel > button { flex: none; }
  #mtoggle {
    position: fixed;
    top: 73px;
    left: 276px;
    z-index: 3;
    width: 29px;
    height: 29px;
    flex: none;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    font-size: 15px;
    line-height: 27px;
    padding: 0;
    transition: left .2s;
  }
  #mtoggle.hidden { left: 8px; }
  #maskSvg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  #maskSvg .mshape { fill: rgba(150,90,50,0.08); stroke: rgba(150,90,50,0.95); stroke-width: 1.5; }
  #maskSvg .mline { stroke: rgba(150,90,50,0.95); stroke-width: 1; fill: none; }
  #maskSvg .mhandle { fill: rgba(150,90,50,0.95); stroke: var(--paper-bright); stroke-width: 1; }
  #wrapper.maskedit #maskSvg [data-role] { pointer-events: auto; }
  #wrapper.maskedit #maskSvg [data-role="body"] { cursor: move; }
  #wrapper.maskedit #maskSvg .mhandle { cursor: pointer; }
  #wrapper.maskedit .marker { pointer-events: none; }
  .btnrow { display: flex; gap: 8px; }
  button {
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
    flex: 1;
  }
  button.active { background: var(--ink); color: var(--paper-bright); }
  .ctrl label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }
  .ctrl .val { color: var(--ink); }
  .ctrl input[type=range] {
    width: 100%;
    accent-color: var(--ink);
    height: 16px;
  }
  .hint { font-size: 12px; color: var(--ink-faint); }
  select {
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 6px 8px;
    width: 100%;
  }
  .help {
    display: inline-block;
    width: 13px;
    height: 13px;
    line-height: 12px;
    text-align: center;
    border: 1px solid var(--border-strong);
    border-radius: 50%;
    font-size: 10px;
    color: var(--ink-faint);
    cursor: help;
    margin-left: 4px;
  }
  #helpPop {
    margin: 0;
    background: var(--paper);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 12px;
    max-width: 260px;
    font-size: 12px;
    line-height: 1.4;
    color: var(--ink-soft);
  }
  #helpTitle { color: var(--ink); font-weight: 600; margin-bottom: 4px; }
  .hint b { font-weight: 600; }
  hr { border: none; border-top: 1px solid var(--border); }
  #status { font-size: 12px; color: var(--ink-faint); min-height: 17px; }
  a.dl { display: none; }
  #view:not([src]) { visibility: hidden; }
</style>
</head>
<body>
<header>
  <h1>contour drawing</h1>
  <div class="sub" id="imginfo"></div>
</header>
<main>
  <div id="stage">
    <div id="wrapper">
      <img id="view" alt="preview">
      <canvas id="orig"></canvas>
      <div id="overlay"></div>
      <div id="divider"></div>
      <svg id="maskSvg"></svg>
    </div>
  </div>
  <div id="panel">
    <div class="btnrow">
      <button id="btnLoad">load image</button>
      <button id="btnExample">example</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" hidden>

    <div class="ctrl">
      <label>mode</label>
      <select id="modeSel">
        <option value="fmm">fast marching</option>
        <option value="diff">difference</option>
      </select>
    </div>

    <div class="ctrl">
      <label>blend</label>
      <select id="blendSel">
        <option value="0,0">off</option>
        <option value="1,1">soft</option>
        <option value="2,1.5" selected>medium</option>
        <option value="4,3">strong</option>
      </select>
    </div>

    <div id="controls"></div>
    <button id="btnReset">reset values</button>

    <hr>
    <div class="hint" id="ptsHint">click sets a point &middot; drag moves it &middot; click a point to delete it &middot; no points: image center</div>
    <button id="btnClearPts">clear all points</button>

    <hr>
    <button id="btnDlSvg">download svg</button>
    <button id="btnDlPy">python script</button>
    <div id="status"></div>
  </div>
</main>

<button id="ptoggle" title="show/hide menu">&rsaquo;</button>

<div id="maskPanel" class="hidden">
  <div class="btnrow">
    <button id="mEllipse">ellipse</button>
    <button id="mRect">rect</button>
    <button id="mLasso">lasso</button>
  </div>
  <button id="mInvert">invert</button>
  <button id="mClear">remove mask</button>
  <div class="hint" id="mHint">pick a shape to clip the lines</div>
</div>
<button id="mtoggle" class="hidden" title="show/hide mask tools">&rsaquo;</button>

<div id="helpPop" popover>
  <div id="helpTitle"></div>
  <div id="helpText"></div>
</div>

<script id="sharedSrc">
'use strict';

// von seite und worker gemeinsam genutzt: vorverarbeitung des graubilds

// separabler gaussian blur, randbehandlung "nearest" wie skimage-default
function gaussianBlur(src, w, h, sigma) {
  if (sigma <= 0) return src;
  const r = Math.ceil(3 * sigma);
  const kernel = new Float32Array(2 * r + 1);
  let sum = 0;
  for (let i = -r; i <= r; i++) {
    kernel[i + r] = Math.exp(-(i * i) / (2 * sigma * sigma));
    sum += kernel[i + r];
  }
  for (let i = 0; i < kernel.length; i++) kernel[i] /= sum;
  const tmp = new Float32Array(w * h);
  const out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let k = -r; k <= r; k++) {
        const xx = Math.min(w - 1, Math.max(0, x + k));
        acc += src[y * w + xx] * kernel[k + r];
      }
      tmp[y * w + x] = acc;
    }
  }
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let k = -r; k <= r; k++) {
        const yy = Math.min(h - 1, Math.max(0, y + k));
        acc += tmp[yy * w + x] * kernel[k + r];
      }
      out[y * w + x] = acc;
    }
  }
  return out;
}

function preprocess(gray, w, h, p) {
  let inten = p.blur > 0 ? gaussianBlur(gray, w, h, p.blur) : new Float32Array(gray);
  if (p.gamma !== 1) {
    let mn = Infinity, mx = -Infinity;
    for (let i = 0; i < inten.length; i++) {
      inten[i] = Math.pow(inten[i], p.gamma);
      if (inten[i] < mn) mn = inten[i];
      if (inten[i] > mx) mx = inten[i];
    }
    const range = mx - mn + 1e-8;
    for (let i = 0; i < inten.length; i++) inten[i] = (inten[i] - mn) / range;
  }
  if (p.darkBoost !== 1 || p.brightCut !== 1) {
    // dark boost teilt (dunkler = langsamer = mehr linien), bright cut zieht richtung weiss
    // (heller = schneller = weniger linien); lineare rampe von 0.1 an den schwellen statt stufe
    for (let i = 0; i < inten.length; i++) {
      const v = inten[i];
      const wd = Math.min(1, Math.max(0, (0.4 - v) / 0.1));
      const wb = Math.min(1, Math.max(0, (v - 0.7) / 0.1));
      inten[i] = v + wd * (v / p.darkBoost - v) + wb * (1 - (1 - v) * p.brightCut - v);
    }
  }
  return inten;
}
</script>

<script id="workerSrc" type="text/plain">
'use strict';

// min-heap mit lazy deletion, wie heapq im python-original
class MinHeap {
  constructor() { this.t = []; this.i = []; }
  push(t, i) {
    const T = this.t, I = this.i;
    let c = T.length;
    T.push(t); I.push(i);
    while (c > 0) {
      const p = (c - 1) >> 1;
      if (T[p] <= T[c]) break;
      [T[p], T[c]] = [T[c], T[p]];
      [I[p], I[c]] = [I[c], I[p]];
      c = p;
    }
  }
  pop() {
    const T = this.t, I = this.i;
    const top = [T[0], I[0]];
    const lt = T.pop(), li = I.pop();
    if (T.length) {
      T[0] = lt; I[0] = li;
      let p = 0;
      for (;;) {
        const l = 2 * p + 1, r = l + 1;
        let s = p;
        if (l < T.length && T[l] < T[s]) s = l;
        if (r < T.length && T[r] < T[s]) s = r;
        if (s === p) break;
        [T[p], T[s]] = [T[s], T[p]];
        [I[p], I[s]] = [I[s], I[p]];
        p = s;
      }
    }
    return top;
  }
  get size() { return this.t.length; }
}

// upwind-loesung der eikonal-gleichung, direkter port von solve_eikonal
function solveEikonal(T, speed, x, y, w, h) {
  const F = speed[y * w + x];
  let txm = Infinity, tym = Infinity;
  if (x > 0) txm = Math.min(txm, T[y * w + x - 1]);
  if (x < w - 1) txm = Math.min(txm, T[y * w + x + 1]);
  if (y > 0) tym = Math.min(tym, T[(y - 1) * w + x]);
  if (y < h - 1) tym = Math.min(tym, T[(y + 1) * w + x]);
  if (txm < Infinity && tym < Infinity) {
    const b = -2 * (txm + tym);
    const c = txm * txm + tym * tym - 1 / (F * F);
    const disc = b * b - 8 * c;
    if (disc >= 0) {
      const tn = (-b + Math.sqrt(disc)) / 4;
      if (tn >= txm && tn >= tym) return tn;
    }
  }
  if (txm < Infinity) {
    const tn = txm + 1 / F;
    if (tym === Infinity || tn <= tym) return tn;
  }
  if (tym < Infinity) return tym + 1 / F;
  return Infinity;
}

function fastMarching(speed, w, h, sources) {
  const T = new Float64Array(w * h).fill(Infinity);
  const status = new Uint8Array(w * h);
  const heap = new MinHeap();
  for (const [sx, sy] of sources) {
    if (sx < 0 || sx >= w || sy < 0 || sy >= h) continue;
    T[sy * w + sx] = 0;
    status[sy * w + sx] = 2;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = sx + dx, ny = sy + dy;
        if (nx < 0 || nx >= w || ny < 0 || ny >= h) continue;
        const ni = ny * w + nx;
        if (status[ni] !== 0) continue;
        status[ni] = 1;
        T[ni] = solveEikonal(T, speed, nx, ny, w, h);
        heap.push(T[ni], ni);
      }
    }
  }
  let processed = 0;
  const total = w * h;
  while (heap.size) {
    const [dist, i] = heap.pop();
    if (status[i] === 2 || dist > T[i]) continue;
    status[i] = 2;
    processed++;
    if (processed % 20000 === 0) postMessage({ type: 'progress', p: processed / total });
    const x = i % w, y = (i - x) / w;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || nx >= w || ny < 0 || ny >= h) continue;
        const ni = ny * w + nx;
        if (status[ni] === 2) continue;
        const tn = solveEikonal(T, speed, nx, ny, w, h);
        if (tn < T[ni]) {
          T[ni] = tn;
          status[ni] = 1;
          heap.push(tn, ni);
        }
      }
    }
  }
  return T;
}

// glatte distanzkarte: eine karte pro quellpunkt, soft-min statt hartem minimum,
// damit sich die fronten ohne knick treffen; danach gauss auf der karte gegen zickzack
// in dunklen zonen (dort liegen die level nur wenige pixel auseinander)
function distanceMap(speed, w, h, sources, params) {
  const maps = sources.map(s => fastMarching(speed, w, h, [s]));
  let D = maps[0];
  if (maps.length > 1 && params.merge > 0) {
    D = new Float64Array(w * h);
    let hi = 0;
    for (let i = 0; i < D.length; i++) {
      let m = Infinity;
      for (const T of maps) if (T[i] < m) m = T[i];
      D[i] = m;
      if (m > hi && m < Infinity) hi = m;
    }
    const s = params.merge * hi / params.num;   // uebergangsbreite in konturabstaenden
    for (let i = 0; i < D.length; i++) {
      let acc = 0;
      for (const T of maps) acc += Math.exp(-(T[i] - D[i]) / s);
      D[i] -= s * Math.log(acc);
    }
  } else if (maps.length > 1) {
    D = new Float64Array(w * h);
    for (let i = 0; i < D.length; i++) {
      let m = Infinity;
      for (const T of maps) if (T[i] < m) m = T[i];
      D[i] = m;
    }
  }
  return params.smooth > 0 ? gaussianBlur(D, w, h, params.smooth) : D;
}

// marching squares: segmente pro zelle, dann verkettung ueber kanten-ids
function contourLevel(T, w, h, L) {
  const pts = new Map();
  const segs = [];
  const hKey = (x, y) => 'h' + x + ',' + y;
  const vKey = (x, y) => 'v' + x + ',' + y;
  function pt(key, x, y, a, b) {
    if (!pts.has(key)) {
      const t = (L - a) / (b - a);
      pts.set(key, key[0] === 'h' ? [x + t, y] : [x, y + t]);
    }
    return key;
  }
  for (let y = 0; y < h - 1; y++) {
    for (let x = 0; x < w - 1; x++) {
      const v0 = T[y * w + x], v1 = T[y * w + x + 1];
      const v2 = T[(y + 1) * w + x + 1], v3 = T[(y + 1) * w + x];
      let idx = 0;
      if (v0 < L) idx |= 1;
      if (v1 < L) idx |= 2;
      if (v2 < L) idx |= 4;
      if (v3 < L) idx |= 8;
      if (idx === 0 || idx === 15) continue;
      const e0 = () => pt(hKey(x, y), x, y, v0, v1);
      const e1 = () => pt(vKey(x + 1, y), x + 1, y, v1, v2);
      const e2 = () => pt(hKey(x, y + 1), x, y + 1, v3, v2);
      const e3 = () => pt(vKey(x, y), x, y, v0, v3);
      switch (idx) {
        case 1: case 14: segs.push([e3(), e0()]); break;
        case 2: case 13: segs.push([e0(), e1()]); break;
        case 3: case 12: segs.push([e3(), e1()]); break;
        case 4: case 11: segs.push([e1(), e2()]); break;
        case 6: case 9:  segs.push([e0(), e2()]); break;
        case 7: case 8:  segs.push([e3(), e2()]); break;
        case 5: case 10: {
          const center = (v0 + v1 + v2 + v3) / 4;
          const tlIn = idx === 5;
          if ((center < L) === tlIn) { segs.push([e0(), e1()]); segs.push([e2(), e3()]); }
          else { segs.push([e3(), e0()]); segs.push([e1(), e2()]); }
          break;
        }
      }
    }
  }
  // verkettung: adjazenz kante -> segmente, dann ketten in beide richtungen laufen
  const adj = new Map();
  segs.forEach((s, i) => {
    for (const k of s) {
      if (!adj.has(k)) adj.set(k, []);
      adj.get(k).push(i);
    }
  });
  const used = new Uint8Array(segs.length);
  const lines = [];
  for (let i = 0; i < segs.length; i++) {
    if (used[i]) continue;
    used[i] = 1;
    const chain = [segs[i][0], segs[i][1]];
    for (const dir of [1, 0]) {
      for (;;) {
        const end = dir ? chain[chain.length - 1] : chain[0];
        const cand = adj.get(end).find(j => !used[j]);
        if (cand === undefined) break;
        used[cand] = 1;
        const [a, b] = segs[cand];
        const next = a === end ? b : a;
        if (dir) chain.push(next); else chain.unshift(next);
      }
    }
    lines.push(chain.map(k => pts.get(k)));
  }
  return lines;
}

onmessage = (e) => {
  const { gray, w, h, params, sources } = e.data;
  const intensity = preprocess(new Float32Array(gray), w, h, params);
  let lines = [];
  {
    const speed = new Float32Array(w * h);
    for (let i = 0; i < speed.length; i++) speed[i] = 1 / Math.max(1 - intensity[i], 1e-6);

    let D, lo, hi;
    if (params.mode === 'diff') {
      // interferenz: differenz der distanzkarten zweier quellpunkt-sets
      const A = sources.filter((_, i) => i % 2 === 0);
      const B = sources.filter((_, i) => i % 2 === 1);
      const TA = distanceMap(speed, w, h, A, params);
      const TB = distanceMap(speed, w, h, B, params);
      D = new Float64Array(w * h);
      for (let i = 0; i < D.length; i++) D[i] = TA[i] - TB[i];
      const sorted = Float64Array.from(D).sort();
      lo = sorted[Math.floor(sorted.length * 0.005)];
      hi = sorted[Math.floor(sorted.length * 0.995)];
    } else {
      D = distanceMap(speed, w, h, sources, params);
      const finite = Float64Array.from(D).sort();
      lo = finite[0];
      hi = finite[Math.min(finite.length - 1, Math.floor(finite.length * 0.9999))];
    }
    for (let l = 0; l < params.num; l++) {
      const L = lo + (hi - lo) * (l / (params.num - 1));

      }
    }
  }

};

const SLIDERS = [
  { key: 'num',       label: 'contours', help: 'number of contour levels between the source point and the farthest region',       min: 5,    max: 200, step: 5,    def: 60 },
  { key: 'minPts',    label: 'min. points', help: 'contours with fewer points than this are dropped, filters small noisy loops',    min: 2,    max: 500, step: 2,    def: 12 },
  { key: 'gamma',     label: 'gamma', help: 'gamma correction before computing: above 1 darkens midtones, below 1 brightens them',          min: 0.2,  max: 3,   step: 0.05, def: 1 },
  { key: 'darkBoost', label: 'dark boost', help: 'darkens shadows (under 40% brightness): above 1 packs more lines into them, good for faces and hair; below 1 thins them out',     min: 0.5,  max: 3,   step: 0.1,  def: 1 },
  { key: 'brightCut', label: 'bright cut', help: 'brightens highlights (over 70% brightness): below 1 thins out lines in sky or white areas',     min: 0.3,  max: 1,   step: 0.05, def: 1 },
  { key: 'blur',      label: 'blur', help: 'gaussian blur applied before computing, smooths noisy detail into calmer lines', min: 0,    max: 5,   step: 0.25, def: 0 },
  { key: 'thickness', label: 'line width', help: 'stroke width of the contour lines in the svg', min: 0.25, max: 3, step: 0.25, def: 1 },
  { key: 'size',      label: 'compute size', help: 'internal resolution (longest edge in px): larger means more detail but slower recomputes', min: 200, max: 800, step: 50, def: 480 },
];
const params = {};

for (const s of SLIDERS) {
  params[s.key] = s.def;
  const div = document.createElement('div');
  div.className = 'ctrl';
  div.innerHTML = `<label><span>${s.label}<span class="help">?</span></span><span class="val" id="val-${s.key}"></span></label>
    <input type="range" id="sl-${s.key}" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.def}">`;
  $('controls').appendChild(div);
  const help = div.querySelector('.help');
  help.addEventListener('mouseenter', () => {
    const pop = $('helpPop');
    if (pop.matches(':popover-open')) pop.hidePopover();
    $('helpTitle').textContent = s.label;
    $('helpText').textContent = s.help;
    pop.showPopover();
    // links neben dem icon positionieren, vertikal am icon zentriert
    const r = help.getBoundingClientRect();
    const pr = pop.getBoundingClientRect();
    pop.style.left = Math.max(8, r.left - pr.width - 8) + 'px';
    pop.style.top = Math.max(8, Math.min(innerHeight - pr.height - 8, r.top + r.height / 2 - pr.height / 2)) + 'px';
  });
  help.addEventListener('mouseleave', () => {
    const pop = $('helpPop');
    if (pop.matches(':popover-open')) pop.hidePopover();
  });
  const input = div.querySelector('input');
  const val = div.querySelector('.val');
  const show = () => { val.textContent = (+input.value).toString(); };
  show();
  input.addEventListener('input', () => {
    params[s.key] = +input.value;
    show();
    if (['gamma', 'darkBoost', 'brightCut', 'blur'].includes(s.key)) livePreview();
    scheduleCompute();
  });
}

params.mode = 'fmm';
const NUM_MODES = {
  fmm:    { label: 'contours', help: 'number of contour levels between the source point and the farthest region' },
  diff:   { label: 'contours', help: 'number of difference levels between the two point sets' },
};
// blend: merge (soft-min breite in konturabstaenden) und smooth (gauss-sigma auf der distanzkarte)
const setBlend = () => { [params.merge, params.smooth] = $('blendSel').value.split(',').map(Number); };
setBlend();
$('blendSel').addEventListener('change', () => { setBlend(); scheduleCompute(); });

$('modeSel').addEventListener('change', () => {
  params.mode = $('modeSel').value;
  const cfg = SLIDERS.find(x => x.key === 'num');
  const m = NUM_MODES[params.mode];
  cfg.label = m.label;
  cfg.help = m.help;
  document.querySelector('#sl-num').closest('.ctrl').querySelector('label > span').firstChild.nodeValue = m.label;
  $('ptsHint').innerHTML = params.mode === 'diff'
    ? 'click sets a point &middot; points alternate between set a and set b (dark) &middot; fewer than two points: two default sources'
    : 'click sets a point &middot; drag moves it &middot; click a point to delete it &middot; no points: image center';
  renderMarkers();
  compute();
});

let sourceImg = null;      // Image-element des originals
let imgName = 'bild';
let points = [];           // normierte koordinaten [0..1]
let svgString = '';
let svgUrl = '';
let origUrl = '';
let worker = null;
let debounceTimer = null;
let splitPos = 0.3;      // anteil links, der das vorverarbeitete original zeigt
let grayCache = null;    // graubild der letzten rechengroesse fuer die live-vorschau
let dispW = 0, dispH = 0;
let lastLines = null, lastDims = null;   // rohe konturen der letzten rechnung

function setStatus(t) { $('status').textContent = t; }

// bild auf die verfuegbare buehnenflaeche skalieren (seitenverhaeltnis bleibt)
function fitView() {
  if (!sourceImg) return;
  const stage = $('stage');
  const s = Math.min(
    (stage.clientWidth - 32) / sourceImg.naturalWidth,
    (stage.clientHeight - 32) / sourceImg.naturalHeight
  );
  dispW = Math.round(sourceImg.naturalWidth * s);
  dispH = Math.round(sourceImg.naturalHeight * s);
  $('view').style.width = dispW + 'px';
  $('view').style.height = dispH + 'px';
  $('maskSvg').setAttribute('viewBox', `0 0 ${dispW} ${dispH}`);
  renderMask();
}
window.addEventListener('resize', fitView);

function loadImage(src, name) {
  const img = new Image();
  img.onload = () => {
    sourceImg = img;
    fitView();
    imgName = name.replace(/\.[^.]+$/, '');
    points = [];
    renderMarkers();
    if (origUrl) URL.revokeObjectURL(origUrl);
    origUrl = src;
    $('imginfo').textContent = `${name} · ${img.naturalWidth}×${img.naturalHeight}px`;
    compute();
  };
  img.onerror = () => setStatus('image could not be loaded');
  img.src = src;
}

$('ptoggle').addEventListener('click', () => {
  const hidden = $('panel').classList.toggle('hidden');
  $('ptoggle').classList.toggle('hidden', hidden);
  $('ptoggle').innerHTML = hidden ? '&lsaquo;' : '&rsaquo;';
  $('stage').classList.toggle('wide', hidden);
  setTimeout(fitView, 220);   // nach ende der gleit-transition neu einpassen
});

$('btnLoad').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', () => {
  const f = $('fileInput').files[0];
  if (f) loadImage(URL.createObjectURL(f), f.name);
});
$('btnExample').addEventListener('click', () => loadImage(DEMO, 'warhol.jpg'));

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadImage(URL.createObjectURL(f), f.name);
});

// ---- quellpunkte ----

function renderMarkers() {
  const ov = $('overlay');
  ov.innerHTML = '';
  points.forEach((p, i) => {
    const m = document.createElement('div');
    m.className = 'marker' + (params.mode === 'diff' && i % 2 ? ' b' : '');
    m.style.left = (p[0] * 100) + '%';
    m.style.top = (p[1] * 100) + '%';
    m.dataset.idx = i;
    ov.appendChild(m);
  });
}

// merken, ob das hilfe-popover beim pointerdown offen war: der schliessende
// klick ins bild soll keinen punkt setzen
let helpWasOpen = false;
document.addEventListener('pointerdown', () => {
  helpWasOpen = $('helpPop').matches(':popover-open');
}, true);

$('wrapper').addEventListener('click', e => {
  if (!sourceImg || helpWasOpen || e.target.closest('.marker') || e.target.closest('#divider')) return;
  const r = $('view').getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width, ny = (e.clientY - r.top) / r.height;
  if (maskEdit) {
    // masken-panel offen: klicks editieren die maske, keine quellpunkte
    if (mask && mask.type === 'lasso' && mask.drawing) {
      const first = mask.points[0];
      if (mask.points.length >= 3 && first &&
          Math.hypot((nx - first[0]) * r.width, (ny - first[1]) * r.height) < 12) {
        mask.drawing = false;
      } else {
        mask.points.push([nx, ny]);
      }
      updateMaskButtons();
      renderMask();
      renderResult();
    }
    return;
  }
  points.push([nx, ny]);
  renderMarkers();
  compute();
});

$('overlay').addEventListener('pointerdown', e => {
  const m = e.target.closest('.marker');
  if (!m) return;
  e.preventDefault();
  const idx = +m.dataset.idx;
  const start = [e.clientX, e.clientY];
  let moved = false;
  m.setPointerCapture(e.pointerId);
  const onMove = ev => {
    if (Math.abs(ev.clientX - start[0]) + Math.abs(ev.clientY - start[1]) > 4) moved = true;
    if (!moved) return;
    const r = $('view').getBoundingClientRect();
    const nx = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
    const ny = Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height));
    points[idx] = [nx, ny];
    m.style.left = (nx * 100) + '%';
    m.style.top = (ny * 100) + '%';
  };
  const onUp = () => {
    m.removeEventListener('pointermove', onMove);
    m.removeEventListener('pointerup', onUp);
    if (!moved) {
      points.splice(idx, 1);
      renderMarkers();
    }
    compute();
  };
  m.addEventListener('pointermove', onMove);
  m.addEventListener('pointerup', onUp);
});

// setzt regler und blend auf die startwerte; modus, bild, punkte und maske bleiben
$('btnReset').addEventListener('click', () => {
  for (const s of SLIDERS) {
    const input = $('sl-' + s.key);
    input.value = s.def;
    input.dispatchEvent(new Event('input'));
  }
  $('blendSel').value = '2,1.5';
  $('blendSel').dispatchEvent(new Event('change'));
});

$('btnClearPts').addEventListener('click', () => {
  if (!points.length) return;
  points = [];
  renderMarkers();
  compute();
});

// ---- berechnung ----

function scheduleCompute() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(compute, 300);
}

function compute() {
  if (!sourceImg) return;
  if (worker) worker.terminate();
  const blob = new Blob([$('sharedSrc').textContent, $('workerSrc').textContent], { type: 'text/javascript' });
  worker = new Worker(URL.createObjectURL(blob));

  const iw = sourceImg.naturalWidth, ih = sourceImg.naturalHeight;
  const scale = Math.min(1, params.size / Math.max(iw, ih));
  const w = Math.max(2, Math.round(iw * scale));
  const h = Math.max(2, Math.round(ih * scale));

  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(sourceImg, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h).data;
  const gray = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    gray[i] = (0.2125 * data[i * 4] + 0.7154 * data[i * 4 + 1] + 0.0721 * data[i * 4 + 2]) / 255;
  }

  let sources;
  if (points.length && !(params.mode === 'diff' && points.length < 2)) {
    sources = points.map(p => [Math.round(p[0] * (w - 1)), Math.round(p[1] * (h - 1))]);
  } else if (params.mode === 'diff') {
    sources = [[Math.round(w / 3), h >> 1], [Math.round(2 * w / 3), h >> 1]];
  } else {
    sources = [[w >> 1, h >> 1]];
  }

  setStatus('computing …');
  worker.onmessage = e => {
    if (e.data.type === 'progress') {
      setStatus(`computing … ${Math.round(e.data.p * 100)}%`);
    } else if (e.data.type === 'done') {
      lastLines = e.data.lines;
      lastDims = { w: e.data.w, h: e.data.h };
      renderResult();
    }
  };
  worker.postMessage({
    gray: gray.buffer, w, h,
    params: {
      mode: params.mode, num: params.num, min: params.minPts, gamma: params.gamma,
      darkBoost: params.darkBoost, brightCut: params.brightCut, blur: params.blur,
      merge: params.merge, smooth: params.smooth,
    },
    sources,
  });
  grayCache = { gray, w, h };
  livePreview();
}

let dlSvg = '';   // download-variante: nur schwarze linien, kein hintergrund

function buildSvg(lines, w, h) {
  const paths = lines.map(line => {
    const d = 'M' + line.map(p => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('L');
    return `<path d="${d}"/>`;
  }).join('\n');
  const sw = (params.thickness * Math.max(w, h) / 500).toFixed(3);
  const g = (stroke, extra) => `<g fill="none" stroke="${stroke}"${extra} stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round">\n${paths}\n</g>`;
  dlSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
${g('#000', '')}
</svg>`;
  svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
<rect width="${w}" height="${h}" fill="#ece2cd"/>
${g('#4a3a28', ' stroke-opacity="0.68"')}
</svg>`;
  if (svgUrl) URL.revokeObjectURL(svgUrl);
  svgUrl = URL.createObjectURL(new Blob([svgString], { type: 'image/svg+xml' }));
  $('view').src = svgUrl;
}

// ---- ansicht und downloads ----

// vergleichs-divider: links vorverarbeitetes original, rechts konturen
function updateSplit() {
  $('orig').style.clipPath = `inset(0 ${(100 - splitPos * 100).toFixed(2)}% 0 0)`;
  $('divider').style.left = (splitPos * 100) + '%';
}
updateSplit();

$('divider').addEventListener('pointerdown', e => {
  e.preventDefault();
  e.stopPropagation();
  const d = $('divider');
  d.setPointerCapture(e.pointerId);
  const onMove = ev => {
    const r = $('view').getBoundingClientRect();
    splitPos = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
    updateSplit();
  };
  const onUp = () => {
    d.removeEventListener('pointermove', onMove);
    d.removeEventListener('pointerup', onUp);
  };
  d.addEventListener('pointermove', onMove);
  d.addEventListener('pointerup', onUp);
});

// ---- alpha-maske: form beschneidet die konturlinien ----

let mask = null;         // {type:'ellipse'|'rect', cx,cy,rx,ry,rot} oder {type:'lasso', points, drawing}; normiert 0..1
let maskInvert = false;
let maskEdit = false;    // linkes panel offen = maske editierbar

function maskPx(w, h) {
  if (mask.type === 'lasso') return { type: 'lasso', pts: mask.points.map(p => [p[0] * w, p[1] * h]) };
  return { type: mask.type, cx: mask.cx * w, cy: mask.cy * h, rx: mask.rx * w, ry: mask.ry * h, rot: mask.rot };
}

function insideMask(m, x, y) {
  let inside;
  if (m.type === 'lasso') {
    inside = false;
    const p = m.pts;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
      if ((p[i][1] > y) !== (p[j][1] > y) &&
          x < (p[j][0] - p[i][0]) * (y - p[i][1]) / (p[j][1] - p[i][1]) + p[i][0]) inside = !inside;
    }
  } else {
    const c = Math.cos(-m.rot), sn = Math.sin(-m.rot);
    const dx = x - m.cx, dy = y - m.cy;
    const lx = dx * c - dy * sn, ly = dx * sn + dy * c;
    inside = m.type === 'ellipse'
      ? (lx * lx) / (m.rx * m.rx) + (ly * ly) / (m.ry * m.ry) <= 1
      : Math.abs(lx) <= m.rx && Math.abs(ly) <= m.ry;
  }
  return maskInvert ? !inside : inside;
}

// polylinien geometrisch kappen, grenzpunkt per bisektion
function clipLines(lines, w, h) {
  if (!mask || (mask.type === 'lasso' && (mask.drawing || mask.points.length < 3))) return lines;
  const m = maskPx(w, h);
  const out = [];
  for (const line of lines) {
    let prev = line[0], prevIn = insideMask(m, prev[0], prev[1]);
    let run = prevIn ? [prev] : null;
    for (let i = 1; i < line.length; i++) {
      const p = line[i], pin = insideMask(m, p[0], p[1]);
      if (pin !== prevIn) {
        let a = prev, b = p;
        for (let k = 0; k < 12; k++) {
          const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
          if (insideMask(m, mid[0], mid[1]) === prevIn) a = mid; else b = mid;
        }
        const cut = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        if (pin) run = [cut, p];
        else { run.push(cut); if (run.length >= 2) out.push(run); run = null; }
      } else if (pin) run.push(p);
      prev = p; prevIn = pin;
    }
    if (run && run.length >= 2) out.push(run);
  }
  return out;
}

function renderResult() {
  if (!lastLines) return;
  const lines = mask ? clipLines(lastLines, lastDims.w, lastDims.h) : lastLines;
  buildSvg(lines, lastDims.w, lastDims.h);
  setStatus(`${lines.length} ${lines.length === 1 ? 'line' : 'lines'}`);
}

function renderMask() {
  const svg = $('maskSvg');
  if (!mask || !maskEdit || !dispW) { svg.innerHTML = ''; return; }
  const m = maskPx(dispW, dispH);
  let el = '';
  if (m.type === 'lasso') {
    const ptsStr = m.pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    el += mask.drawing
      ? `<polyline class="mline" points="${ptsStr}"/>`
      : `<polygon class="mshape" data-role="body" points="${ptsStr}"/>`;
    el += m.pts.map((p, i) =>
      `<circle class="mhandle" data-role="vertex" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="5"/>`).join('');
  } else {
    const deg = (m.rot * 180 / Math.PI).toFixed(2);
    const tf = `transform="rotate(${deg} ${m.cx} ${m.cy})"`;
    el += m.type === 'ellipse'
      ? `<ellipse class="mshape" data-role="body" cx="${m.cx}" cy="${m.cy}" rx="${m.rx}" ry="${m.ry}" ${tf}/>`
      : `<rect class="mshape" data-role="body" x="${m.cx - m.rx}" y="${m.cy - m.ry}" width="${2 * m.rx}" height="${2 * m.ry}" ${tf}/>`;
    el += `<line class="mline" x1="${m.cx}" y1="${m.cy - m.ry}" x2="${m.cx}" y2="${m.cy - m.ry - 24}" ${tf}/>`;
    el += [['rx', m.cx + m.rx, m.cy], ['ry', m.cx, m.cy + m.ry], ['rot', m.cx, m.cy - m.ry - 24]]
      .map(([role, x, y]) => `<circle class="mhandle" data-role="${role}" cx="${x}" cy="${y}" r="6" ${tf}/>`).join('');
  }
  svg.innerHTML = el;
}

$('maskSvg').addEventListener('pointerdown', e => {
  const role = e.target.dataset && e.target.dataset.role;
  if (!role || !mask || !maskEdit) return;
  e.preventDefault();
  e.stopPropagation();
  if (mask.type === 'lasso' && mask.drawing) {
    // klick auf den startpunkt schliesst das lasso (behandelt der wrapper-click)
    return;
  }
  const svg = $('maskSvg');
  svg.setPointerCapture(e.pointerId);
  const rect = $('view').getBoundingClientRect();
  const toNorm = ev => [(ev.clientX - rect.left) / rect.width, (ev.clientY - rect.top) / rect.height];
  let last = toNorm(e);
  const vi = role === 'vertex' ? +e.target.dataset.i : -1;
  const onMove = ev => {
    const p = toNorm(ev);
    const dx = p[0] - last[0], dy = p[1] - last[1];
    if (role === 'body') {
      if (mask.type === 'lasso') mask.points = mask.points.map(q => [q[0] + dx, q[1] + dy]);
      else { mask.cx += dx; mask.cy += dy; }
    } else if (role === 'vertex') {
      mask.points[vi] = p;
    } else if (role === 'rot') {
      mask.rot = Math.atan2((p[1] - mask.cy) * rect.height, (p[0] - mask.cx) * rect.width) + Math.PI / 2;
    } else {
      // rx/ry: zeigerabstand vom zentrum auf die gedrehte achse projiziert
      const px = (p[0] - mask.cx) * rect.width, py = (p[1] - mask.cy) * rect.height;
      const c = Math.cos(-mask.rot), sn = Math.sin(-mask.rot);
      const lx = px * c - py * sn, ly = px * sn + py * c;
      if (role === 'rx') mask.rx = Math.max(0.02, Math.abs(lx) / rect.width);
      else mask.ry = Math.max(0.02, Math.abs(ly) / rect.height);
    }
    last = p;
    renderMask();
    renderResult();
  };
  const onUp = () => {
    svg.removeEventListener('pointermove', onMove);
    svg.removeEventListener('pointerup', onUp);
  };
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
});

function setMask(m) { mask = m; updateMaskButtons(); renderMask(); renderResult(); }

function updateMaskButtons() {
  $('mEllipse').classList.toggle('active', !!mask && mask.type === 'ellipse');
  $('mRect').classList.toggle('active', !!mask && mask.type === 'rect');
  $('mLasso').classList.toggle('active', !!mask && mask.type === 'lasso');
  $('mHint').textContent = !mask
    ? 'pick a shape to clip the lines'
    : mask.type === 'lasso' && mask.drawing
      ? 'click on the image to add points · click the first point to close'
      : 'drag inside moves · handles resize · dot rotates';
}

// klick auf das bereits aktive werkzeug entfernt die maske wieder
const toggleMask = m => setMask(mask && mask.type === m.type ? null : m);
$('mEllipse').addEventListener('click', () =>
  toggleMask({ type: 'ellipse', cx: 0.5, cy: 0.5, rx: 0.35, ry: 0.4, rot: 0 }));
$('mRect').addEventListener('click', () =>
  toggleMask({ type: 'rect', cx: 0.5, cy: 0.5, rx: 0.35, ry: 0.4, rot: 0 }));
$('mLasso').addEventListener('click', () =>
  toggleMask({ type: 'lasso', points: [], drawing: true }));
$('mInvert').addEventListener('click', () => {
  maskInvert = !maskInvert;
  $('mInvert').classList.toggle('active', maskInvert);
  renderResult();
});
$('mClear').addEventListener('click', () => setMask(null));

$('mtoggle').addEventListener('click', () => {
  const hidden = $('maskPanel').classList.toggle('hidden');
  maskEdit = !hidden;
  $('mtoggle').classList.toggle('hidden', hidden);
  $('mtoggle').innerHTML = hidden ? '&rsaquo;' : '&lsaquo;';
  $('stage').classList.toggle('mleft', !hidden);
  $('wrapper').classList.toggle('maskedit', !hidden);
  renderMask();
  setTimeout(fitView, 220);
});

// vorverarbeitetes graubild neutral auf den canvas zeichnen
function buildOrig(inten, w, h) {
  const cv = $('orig');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const id = ctx.createImageData(w, h);
  for (let i = 0; i < w * h; i++) {
    const g = 255 * Math.min(1, Math.max(0, inten[i]));
    id.data[i * 4] = g;
    id.data[i * 4 + 1] = g;
    id.data[i * 4 + 2] = g;
    id.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(id, 0, 0);
  cv.classList.add('ready');
}

// live-vorschau der vorverarbeitung, an animation frames gedrosselt
let liveQueued = false;
function livePreview() {
  if (!grayCache || liveQueued) return;
  liveQueued = true;
  requestAnimationFrame(() => {
    liveQueued = false;
    if (!grayCache) return;
    buildOrig(preprocess(grayCache.gray, grayCache.w, grayCache.h, params), grayCache.w, grayCache.h);
  });
}

$('btnDlSvg').addEventListener('click', () => {
  if (!dlSvg) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([dlSvg], { type: 'image/svg+xml' }));
  a.download = imgName + '-contour.svg';
  a.click();
  URL.revokeObjectURL(a.href);
});
$('btnDlPy').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = 'contour-drawing.py';
  a.download = 'contour-drawing.py';
  a.click();
});

// demo eingebettet als data-uri, damit die seite auch per file:// laeuft
loadImage(DEMO, 'warhol.jpg');
